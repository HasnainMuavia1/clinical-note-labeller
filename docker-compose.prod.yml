# Deployment compose: pulls prebuilt images, builds nothing.
# The client needs only this file and a .env; the code dictionaries are baked
# into the backend image, so there is nothing else to download or mount.
name: clinical-note-labeller

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://labeller:labeller@postgres:5432/labeller
  REDIS_URL: redis://redis:6379/0
  WORKSPACE_ROOT: /data/workspace
  REFERENCE_ROOT: /data/reference
  SANDBOX_URL: http://parser-sandbox:8081
  API_KEYS: ${APP_API_KEY:-dev-key}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MINI_MODEL_ID: ${OPENAI_MINI_MODEL_ID:-gpt-5.4-mini}
  LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
  CODE_EVIDENCE_THRESHOLD: ${CODE_EVIDENCE_THRESHOLD:-1.0}
  SPECIALTY_CONFIDENCE_THRESHOLD: ${SPECIALTY_CONFIDENCE_THRESHOLD:-0.65}
  LLM_BATCH_MIN_FILES: ${LLM_BATCH_MIN_FILES:-10}
  FILE_CONCURRENCY: ${FILE_CONCURRENCY:-0}
  CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-0}
  LLAMA_PARSE_TIER: ${LLAMA_PARSE_TIER:-standard}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labeller
      POSTGRES_PASSWORD: labeller
      POSTGRES_DB: labeller
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeller"]
      interval: 5s
      retries: 12
    networks: [appnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    networks: [appnet]

  # Parses untrusted documents with no route to the internet and no credentials.
  parser-sandbox:
    image: ghcr.io/hasnainmuavia1/clinical-note-labeller/sandbox:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      OCR_WORKERS: ${OCR_WORKERS:-0}
      SANDBOX_WORKERS: ${SANDBOX_WORKERS:-2}
    networks: [sandboxnet]
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g

  api:
    image: ghcr.io/hasnainmuavia1/clinical-note-labeller/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - "${WORKSPACE_DIR:-./workspace}:/data/workspace"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Bound to the loopback interface: this is a desktop app, not a network service.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    networks: [appnet]

  worker:
    image: ghcr.io/hasnainmuavia1/clinical-note-labeller/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - "${WORKSPACE_DIR:-./workspace}:/data/workspace"
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Both networks: reaches the sandbox and the internet (OpenAI, LlamaParse, NPI).
    networks: [appnet, sandboxnet]

  frontend:
    image: ghcr.io/hasnainmuavia1/clinical-note-labeller/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_API_KEY: ${APP_API_KEY:-dev-key}
    depends_on: [api]
    ports: ["127.0.0.1:${UI_PORT:-5173}:80"]
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
  sandboxnet:
    internal: true
