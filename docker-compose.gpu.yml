# Auto-attached by `make up` / tools/stack.py when NVIDIA is on the host.
# Requires the NVIDIA Container Toolkit. CPU-only hosts never load this file.

services:
  worker:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all

  parser-sandbox:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OCR_WORKERS: ${OCR_WORKERS:-0}
      SANDBOX_WORKERS: ${SANDBOX_WORKERS:-4}
    gpus: all
